server:
  port: 4443

spring:
  application:
    name: gateway
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://localhost:9001
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: oauth2-server
              uri: http://localhost:9001
              predicates:
                - Header=X-Request-Id, \d+
            - id: fellow-worker
              uri: http://localhost:4334
              predicates:
                - Header=X-Request-Id, \d+
            - id: cv-generator
              uri: http://localhost:7044
              predicates:
                - Header=X-Request-Id, \d+

fellow-worker-app-gateway:
  authorization-url: "/"
  token-url: "/"
  unprotected-patterns:
    - "/assets/**"
    - "/actuator/**"
    - "/webjars/**"

management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: "*"


