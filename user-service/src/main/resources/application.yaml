server:
  port: 7001
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: user-service
  profiles:
    active: local
  config:
    import:
      - configserver:http://localhost:7004
      - vault://
  cloud:
    vault:
      authentication: token
      kv:
        backend: secrets/fellow-worker
        application-name: ${spring.application.name}
        enabled: true
        profiles:
          - local
      enabled: true
      uri: http://localhost:8200
      token: ${VAULT_TOKEN}
    config:
      enabled: true
      uri: http://localhost:9099
      fail-fast: true
      retry:
        initialInterval: 300
        maxAttempts: 10
        max-interval: 3000
  jpa:
    show-sql: true

management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: info