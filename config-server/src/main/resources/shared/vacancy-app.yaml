spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/fellow-worker}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: vacancy
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 10000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    function:
      definition: userEventConsumer;companyEventConsumer
    stream:
      bindings:
        userEventConsumer-in-0:
          destination: user.event
          group: vacancy-app-user-event
          content-type: application/json
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 10000
            back-off-multiplier: 2.0
        companyEventConsumer-in-0:
          destination: company.event
          group: vacancy-app-company-event
          content-type: application/json
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 10000
            back-off-multiplier: 2.0
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
        bindings:
          userEventConsumer-in-0:
            consumer:
              enableDlq: true
              dlqName: user.event.vacancy-app.dlq
          companyEventConsumer-in-0:
            consumer:
              enableDlq: true
              dlqName: company.event.vacancy-app.dlq

server:
  shutdown: graceful

management:
  health:
    db:
      enabled: true
    liveness-state:
      enabled: true
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health, prometheus, refresh, busrefresh
    access:
      default: read_only
  endpoint:
    health:
      probes:
        enabled: true
      access: read_only
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db
    metrics:
      access: read_only
    prometheus:
      access: read_only
    busrefresh:
      access: unrestricted
  defaults:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0 # 100% all request receive traceID/spandId inside MDC;
    export:
      enabled: false
    propagation:
      consume: [ B3, B3_MULTI, W3C ] # completable with monolith module crm-2.0
      produce: [ W3C ] # since we have no reverse integrations into the monolith, we use only W3C
  observations:
    annotations:
      enabled: true
