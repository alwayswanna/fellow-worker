app:
  routes:
    - id: resume-app
      uri: ${app.resume-app.uri}
    - id: user-app
      uri: ${app.user-app.uri}
    - id: vacancy-app
      uri: ${app.vacancy-app.uri}
    - id: company-app
      uri: ${app.company-app.uri}
  resume-app:
    uri: http://localhost:9091
  user-app:
    uri: http://localhost:9098
  vacancy-app:
    uri: http://localhost:9099
  company-app:
    uri: http://localhost:9070

springdoc:
  swagger-ui:
    urls:
      - name: resume-app
        url: /resume-app/v3/api-docs
      - name: user-app
        url: /user-app/v3/api-docs
      - name: vacancy-app
        url: /vacancy-app/v3/api-docs
      - name: company-app
        url: /company-app/v3/api-docs

spring:
  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
        pool:
          # FIXED вместо ELASTIC: ограничиваем общее число соединений на downstream,
          # чтобы сетевая деградация одного сервиса не привела к неограниченному росту
          # коннектов и исчерпанию файловых дескрипторов гейтвея.
          type: fixed
          max-connections: 500
          acquire-timeout: 5000
          max-idle-time: 30s
          max-life-time: 5m
          eviction-interval: 60s
          # Публикует метрики пула соединений (connections.active/idle/pending) в Micrometer.
          metrics: true
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "*"
                allowed-methods: "*"
                allowed-headers: "*"

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
    instances:
      # resume-app отдаёт/принимает файлы через MinIO — медленнее остальных сервисов,
      # поэтому даём ему больше терпимости к единичным медленным вызовам и дольше окно наблюдения.
      resume-app:
        base-config: default
        sliding-window-size: 30
        minimum-number-of-calls: 15
        wait-duration-in-open-state: 20s
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
    instances:
      resume-app:
        base-config: default
        timeout-duration: 30s
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 50
        max-wait-duration: 0ms
    instances:
      resume-app:
        base-config: default
        max-concurrent-calls: 20
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0ms

management:
  tracing:
    enabled: true
    propagation:
      type: w3c,b3 # Поддержка двух стандартов: W3C - современный стандарт; B3 - legacy, на всякий случай
  health:
    liveness-state:
      enabled: true
    readiness-state:
      enabled: true
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health, prometheus, refresh, busrefresh
  endpoint:
    metrics:
      access: unrestricted
    health:
      access: unrestricted
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          # Готовность отражает только способность самого гейтвея принимать трафик,
          # а НЕ здоровье downstream-сервисов: один упавший downstream обрабатывается
          # circuit breaker/fallback, и не должен выводить из ротации весь гейтвей.
          include: readinessState
    prometheus:
      access: unrestricted
    busrefresh:
      access: unrestricted
  defaults:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        spring:
          cloud:
            gateway:
              requests: true
      percentiles:
        spring:
          cloud:
            gateway:
              requests: 0.5,0.95,0.99
