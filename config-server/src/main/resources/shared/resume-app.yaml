app:
  observability:
    excluded-patterns:
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:resume-app}

spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/fellow-worker}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: resume
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    default-schema: resume
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # create/update each write resume + skills + experience + education + links in one
        # transaction (ResumeRepositoryAdapter) — batching coalesces those into fewer round trips
        # instead of one statement per row.
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    function:
      definition: userEventConsumer
    stream:
      bindings:
        userEventConsumer-in-0:
          destination: user.event
          group: resume-app
          content-type: application/json
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 10000
            back-off-multiplier: 2.0
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
        bindings:
          userEventConsumer-in-0:
            consumer:
              enableDlq: true
              dlqName: user.event.resume-app.dlq

resilience4j:
  circuitbreaker:
    instances:
      minio:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
  bulkhead:
    instances:
      minio:
        max-concurrent-calls: 10
        max-wait-duration: 0ms

server:
  shutdown: graceful

management:
  health:
    db:
      enabled: true
    liveness-state:
      enabled: true
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health, prometheus, refresh, busrefresh
    access:
      default: read_only
  endpoint:
    health:
      probes:
        enabled: true
      access: read_only
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db
    metrics:
      access: read_only
    prometheus:
      access: read_only
    busrefresh:
      access: unrestricted
  defaults:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      # 100% by default (dev/local) — easiest to debug when every request has a trace.
      # Overridden down for prod below; at real traffic volumes 100% sampling is needless tracing
      # backend load for traces nobody will look at.
      probability: 1.0
    # Must stay true even without a real tracing backend: Spring Boot gates propagator bean
    # creation (traceparent/B3 header inject+extract) on this flag, not just span export — with
    # it false, consume/produce below silently become no-ops and traceId stops propagating
    # between services even though MDC still fills in locally.
    export:
      enabled: true
    propagation:
      consume: [ B3, B3_MULTI, W3C ] # completable with monolith module crm-2.0
      produce: [ W3C ] # since we have no reverse integrations into the monolith, we use only W3C
  observations:
    annotations:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod

management:
  tracing:
    sampling:
      probability: 0.1
