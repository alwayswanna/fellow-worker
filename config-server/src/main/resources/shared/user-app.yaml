app:
  observability:
    excluded-patterns:
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
  schedulers:
    create-partition: 0 0 0 1 * ?
    drop-partition: 0 0 0 1 * ?
  outbox:
    scheduler:
      cron: "*/10 * * * * *"
    lock:
      at-most-for: PT15S
      at-least-for: PT5S
    batch-size: 100
    max-retries: 5
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:user-app}
    max-retries: 3
  photo-upload:
    max-size-bytes: 5242880
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/gif
  encoder-strength: 13
  role:
    role-code: ADMIN
    role-name: Administrator
  admin:
    username: admin
    password: admin
    role-code: admin-role
  unprotected-patterns:
    - /v3/api-docs
    - /swagger-ui.html
    - /swagger-ui/**
    - /actuator/health
    - /actuator/health/*
    - /actuator/prometheus
    - /actuator/busrefresh
    - /api/v1/users/register
    - /api/v1/users/*/photo
    - /api/v1/roles
    - /oauth2/**
    - /login
  drop-partition:
    lock:
      at-most-for: PT30S
      at-least-for: PT20S
  create-partition:
    lock:
      at-most-for: PT30S
      at-least-for: 20S
  drop-partition-for: P1M
  create-partition-for: P1M
  registered-client:
    client-id: default
    client-secret: defaultSecret
    client-name: defaultRegisteredClient
    redirect-uris:
      - http://localhost:8080
    scopes:
      - openid
  init:
    registered-client: true
    default-user: true
  registered-client-default-options:
    client-secret-expires-at: P3M
    access-token-time-to-live: PT30M
  security-constraints:
    - roles:
        - ADMIN
      security-collections:
        - patterns:
            - "/api/v1/admin/**"

spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/fellow-worker}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: user
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 10000
      leak-detection-threshold: 30000
  liquibase:
    default-schema: user
    change-log: classpath:/db/changelog/db.changelog-main.yaml
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    stream:
      bindings:
        user-events-out-0:
          destination: user.event
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
          producer-properties:
            acks: all
            enable.idempotence: true
            retries: 3
            delivery.timeout.ms: 30000
  security:
    oauth2:
      authorization-server:
        client:
          default-client:
            registration:
              client-name: default
              client-id: default
              client-secret: default_secret
              client-authentication-methods:
                - client_secret_basic
                - client_secret_post
              authorization-grant-types:
                - authorization_code
                - refresh_token
                - client_credentials
              redirect-uris:
                - http://127.0.0.1:9097/swagger-ui/oauth2-redirect.html
                - https://oauth.pstmn.io/v1/browser-callback
                - http://localhost:4000/
              scopes:
                - openid
                - profile
            require-authorization-consent: false
            require-proof-key: false
          flutter-client:
            registration:
              client-id: flutter-client
              client-name: Fellow Worker Flutter Web
              client-authentication-methods:
                - none
              authorization-grant-types:
                - authorization_code
                - refresh_token
              redirect-uris:
                - http://localhost:4000/
                - https://oauth.pstmn.io/v1/browser-callback
              post-logout-redirect-uris:
                - http://localhost:4000/
              scopes:
                - openid
                - profile
            require-authorization-consent: false
            require-proof-key: true

server:
  shutdown: graceful

management:
  health:
    db:
      enabled: true
    liveness-state:
      enabled: true
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health, prometheus, refresh, busrefresh
    access:
      default: read_only
  endpoint:
    health:
      probes:
        enabled: true
      access: read_only
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db
    metrics:
      access: read_only
    prometheus:
      access: read_only
    busrefresh:
      access: unrestricted
  defaults:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0 # 100% all request receive traceID/spandId inside MDC;
    export:
      enabled: false
    propagation:
      consume: [ B3, B3_MULTI, W3C ] # completable with monolith module crm-2.0
      produce: [ W3C ] # since we have no reverse integrations into the monolith, we use only W3C
  observations:
    annotations:
      enabled: true